plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        client { client() }
        clientSmoke {
            client()
            gameDirectory = file('run-client-smoke')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach { systemProperty 'neoforge.logging.console.level', 'debug' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}
dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description, geckolib_version: geckolib_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}
publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = layout.projectDirectory.dir('mcmodsrepo') } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Opt-in integration tests run inside Minecraft, excluded from release jars.
if (providers.gradleProperty('q2wGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

if (providers.gradleProperty('q2wClientSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/clienttest/java'
}

// Keep diagnostic code/resources out of distributable jars, including after opt-in test runs.
tasks.named('jar', Jar).configure {
    exclude 'mett/palemannie/q2w/PortGameTests*'
    exclude 'mett/palemannie/q2w/ClientSmokeTest*'
    exclude 'data/q2w/structure/empty.nbt'
}
